apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: model
  name: model
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model
  strategy: {}
  template:
    metadata:
      labels:
        app: model
    spec:
      containers:
      - image: ufuos10/house-price-model:latest
        name: house-price-model
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "250m"
            memory: "562Mi"
          limits:
            cpu: "500m"
            memory: "562Mi"
status: {}
